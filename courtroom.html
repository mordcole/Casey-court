<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Court — procedural Beaux-Arts courtroom</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }

  /* ── loading / bake indicator ─────────────────────────────────────────── */
  #loader { position:fixed; inset:0; background:#0a0908; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:30; transition:opacity .9s ease; }
  #loader.done { opacity:0; pointer-events:none; }
  #loader h1 { color:#c9b891; font-weight:normal; font-size:15px; letter-spacing:.42em;
    text-transform:uppercase; margin:0 0 22px; }
  #loader .bar { width:min(320px, 70vw); height:2px; background:#2a251d; }
  #loader .bar i { display:block; height:100%; width:0%; background:#c9b891; transition:width .15s linear; }
  #loader p { color:#6b6152; font-size:11px; letter-spacing:.2em; margin:14px 0 0; text-transform:uppercase; }

  /* ── WebGL2 fallback ──────────────────────────────────────────────────── */
  #nogl { display:none; position:fixed; inset:0; background:#0a0908; z-index:40;
    align-items:center; justify-content:center; text-align:center; padding:32px; }
  #nogl div { max-width:460px; color:#c9b891; }
  #nogl h1 { font-weight:normal; letter-spacing:.3em; font-size:16px; text-transform:uppercase; }
  #nogl p { color:#8a7f6c; font-size:13px; line-height:1.7; }

  /* ── demo controls ────────────────────────────────────────────────────── */
  #ui { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; flex-wrap:wrap;
    gap:8px; align-items:center; justify-content:center; padding:12px 14px 16px;
    background:linear-gradient(transparent, rgba(8,7,5,.82)); transition:opacity .5s; }
  #ui.hidden { display:none; }
  #ui button { font-family:inherit; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:#d8c9a3; background:rgba(30,26,19,.78); border:1px solid #4a4030; border-radius:3px;
    padding:10px 12px; cursor:pointer; min-height:40px; }
  #ui button.active { background:#5a4a2a; color:#f4e9cc; border-color:#8a744a; }
  #ui button:active { background:#6a5836; }
  #ui .amp { display:flex; align-items:center; gap:8px; color:#8a7f6c; font-size:10px;
    letter-spacing:.18em; text-transform:uppercase; }
  #ui input[type=range] { width:130px; accent-color:#c9a24a; height:28px; }
  #transcript { position:fixed; left:14px; top:12px; z-index:20; color:#9c8f74; font-size:11px;
    letter-spacing:.06em; max-width:44vw; opacity:.85; pointer-events:none; font-style:italic; }
  #transcript.hidden { display:none; }
</style>
</head>
<body>
<div id="stage"></div>

<div id="loader">
  <h1>The Court</h1>
  <div class="bar"><i id="loadbar"></i></div>
  <p id="loadmsg">preparing the room…</p>
</div>

<div id="nogl"><div>
  <h1>The Court</h1>
  <p>This chamber is rendered with WebGL&nbsp;2, which your browser does not provide.
     Please revisit from a current version of Chrome, Edge, Firefox or Safari.</p>
</div></div>

<div id="transcript"></div>

<div id="ui">
  <button data-state="IDLE">Idle</button>
  <button data-state="RISING">All rise</button>
  <button data-state="AWAITING">Awaiting</button>
  <button data-state="COURT_SPEAKING">Court speaking</button>
  <button data-state="ADJOURNED">Adjourned</button>
  <span class="amp">amp <input id="amp" type="range" min="0" max="100" value="0"></span>
  <button id="simulate">Simulate hearing</button>
</div>

<!-- WebGL2 gate runs as a CLASSIC script so it fires even if the module
     import below never resolves (three r185 requires WebGL2). -->
<script>
  window.__WEBGL2_OK = (() => {
    try { return !!document.createElement('canvas').getContext('webgl2'); }
    catch (e) { return false; }
  })();
  if (!window.__WEBGL2_OK) {
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('nogl').style.display = 'flex';
      document.getElementById('loader').style.display = 'none';
      document.getElementById('ui').classList.add('hidden');
    });
  }
</script>

<!-- three.js r185 from CDN — the only external reference in this file -->
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js" } }
</script>

<script type="module">
// ═══════════════════════════════════════════════════════════════════════════
//  A PROCEDURAL BEAUX-ARTS COURTROOM  —  single-file visual spike
//
//  A high-fidelity procedural reconstruction of COURTROOM ONE of the James
//  R. Browning U.S. Court of Appeals Building, San Francisco (1905), from
//  the Carol Highsmith / LOC reference photographs: cove-vaulted ornamented
//  plaster ceiling with glowing laylights ringed by marquee bulbs,
//  book-matched Pavonazzo marble walls, red-breccia aedicule framing a
//  geometric diamond mosaic, allegorical mosaic lunette in the attic, long
//  mahogany en-banc bench.  NO real court's name or official seal appears
//  anywhere: the mosaics are generic geometric/allegorical art.
//
//  Techniques (reimplemented, not copied, from studying deedy/glacial-valley):
//   · one shared GLSL noise library, all hero surfaces hand-written shaders
//   · load-time CPU light bake — here a 3-D light volume (sun shafts, sky
//     fill, ambient occlusion, fixture glow) DDA-marched through a
//     voxelised occupancy grid of the room, sampled by every material
//   · all materials output linear HDR; one post pass does adaptive
//     exposure → ACES → grade → vignette → film grain → gamma
//
//  Determinism: ?pose=STATE&amp=N freezes the injected clock, dust, grain
//  and easing so screenshots are reproducible.  Demo UI hides under ?pose.
// ═══════════════════════════════════════════════════════════════════════════

// ── WebGL2 gate: the classic script above already showed the fallback UI;
//    here we only stop the module (imports hoist, so this runs post-import) ──
if (!window.__WEBGL2_OK) throw new Error('WebGL2 unavailable');

import * as THREE from 'three';

// ── URL params / determinism ────────────────────────────────────────────────
const qp = new URLSearchParams(location.search);
const POSE = qp.get('pose');                       // freeze scene in a state
const POSE_AMP = Math.min(1, Math.max(0, parseFloat(qp.get('amp') ?? '0.6') || 0));
const POSE_TIME = 11.35;                           // frozen master clock (s)

// ── deterministic RNG ───────────────────────────────────────────────────────
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── injectable clocks ───────────────────────────────────────────────────────
const RealClock   = () => ({ now: () => performance.now() / 1000 });
const FrozenClock = (t) => ({ now: () => t });

// ═══════════════════════════════════════════════════════════════════════════
//  PALETTE — sampled from the Courtroom One reference photographs (Carol
//  Highsmith / LOC, supplied by the user in-session): book-matched Pavonazzo
//  walls, red-breccia aedicule, near-black mahogany bench, grey-blue carpet,
//  warm marquee-bulb strings around cool glowing laylights.  The lunette
//  mosaic close-up drives the pictorial tesserae palette.
// ═══════════════════════════════════════════════════════════════════════════
const P = {
  marbleWhiteA:  0xece7db,  marbleWhiteB: 0xd4ccbe,  marbleVeinGrey: 0x59525c,
  marbleRedA:    0x6e352c,  marbleRedB:   0x8f4b3a,  marbleRedVein:  0xd9c3a4,
  marbleVerdeA:  0x1a2620,  marbleVerdeB: 0x2e4436,  marbleVerdeVein:0x8aa68c,
  mahoganyA:     0x28130a,  mahoganyB:    0x4e2a16,  mahoganyC:      0x6b3f26,
  oakA:          0x53301b,  oakB:         0x8a5a32,
  brassA:        0x71582a,  brassB:       0xbfa054,  brassHi:        0xf0e0ac,
  leatherA:      0x131417,  leatherB:     0x24262b,
  plasterA:      0xe9dfc9,  plasterB:     0xcfc3a8,
  mosaicGoldA:   0xb1883c,  mosaicGoldB:  0xe2c06a,  mosaicBlue:     0x27405e,
  mosaicGreen:   0x39543f,  mosaicIvory:  0xe8dfc8,  mosaicOx:       0x6c2f24,
  lunPurple:     0x4d4766,  lunErmine:    0xdcd4de,  lunSunset:      0xd9a83c,
  lunOrange:     0xc27a34,  lunTree:      0x21333c,  lunRusset:      0x8a4a28,
  lunFlesh:      0xd7a87f,  lunOlive:     0x6d6749,
  carpetA:       0x5f6a66,  carpetB:      0x818c86,
  paperA:        0xe9e2d0,
  robeA:         0x14131a,
  sunCol:        [1.00, 0.90, 0.74],   // warm sun through the arched windows
  winCol:        [0.62, 0.70, 0.82],   // cool daylight: laylights + window fill
  ambCol:        [0.44, 0.38, 0.30],   // warm stone bounce
  fixCol:        [1.00, 0.80, 0.52],   // incandescent marquee bulbs
};
const C3 = (hex) => { const c = new THREE.Color(hex); return `vec3(${c.r.toFixed(4)},${c.g.toFixed(4)},${c.b.toFixed(4)})`; };

// ── room dimensions (metres) ────────────────────────────────────────────────
const ROOM = { x0: -7.6, x1: 7.6, y0: 0, y1: 8.75, z0: -11.5, z1: 11.5 };
// ceiling section (matches the hero photo): arcade → entablature → attic →
// cornice → cove vault rising to a flat centre carrying three laylights
const CEIL = { arcTop: 5.15, ent0: 5.15, ent1: 6.02, att1: 6.92, cor1: 7.18, flatY: 8.55, coveW: 2.7 };
const LAYLIGHTS = [ { z: -5.2, w: 4.6, d: 2.7 }, { z: 0, w: 4.6, d: 2.7 }, { z: 5.2, w: 4.6, d: 2.7 } ];
const SUN_TO_SCENE = new THREE.Vector3(0.74, -0.58, -0.34).normalize(); // through the -X windows, raking toward the bench-left corner
const SUN_DIR = SUN_TO_SCENE.clone().negate();                          // toward the sun
const WINDOWS = [   // arched openings in the -X wall: [zCenter, width, sillY, springY, archR]
  { z: -3.4, w: 1.7, sill: 1.35, spring: 3.85, r: 0.85 },
  { z:  1.6, w: 1.7, sill: 1.35, spring: 3.85, r: 0.85 },
];

// ═══════════════════════════════════════════════════════════════════════════
//  SHADERS
//  Every hero surface is a hand-written GLSL3 material.  They share COMMON:
//  noise library + the baked 3-D light volume + one physically-flavoured
//  shade() that outputs linear HDR.  Post does ACES/grain/vignette later.
// ═══════════════════════════════════════════════════════════════════════════
const GLSL_COMMON = /* glsl */`
precision highp float;
precision highp sampler3D;
uniform float uTime;
uniform sampler3D uVol;      // R sun visibility · G ambient occlusion · B fixture · A window fill
uniform vec3  uVolMin, uVolSize;
uniform vec3  uSunDir;       // toward the sun
uniform vec3  uSunCol, uWinCol, uAmbCol, uFixCol;
uniform float uHouse;        // house (fixture) light level, state-driven
uniform vec3  uLampPos;  uniform float uLampI;   // bench lamp  (amp-reactive)
uniform vec3  uLectPos;  uniform float uLectI;   // lectern pool light
uniform vec3  uCamPos;

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash13(vec3 p){ p = fract(p*0.1031); p += dot(p, p.zyx+31.32); return fract((p.x+p.y)*p.z); }
vec2  hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973)); p3 += dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), u.x),
             mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), u.x), u.y);
}
float vnoise3(vec3 p){
  vec3 i = floor(p), f = fract(p); vec3 u = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i), hash13(i+vec3(1,0,0)), u.x),
                 mix(hash13(i+vec3(0,1,0)), hash13(i+vec3(1,1,0)), u.x), u.y),
             mix(mix(hash13(i+vec3(0,0,1)), hash13(i+vec3(1,0,1)), u.x),
                 mix(hash13(i+vec3(0,1,1)), hash13(i+vec3(1,1,1)), u.x), u.y), u.z);
}
float fbm(vec2 p){ float a=0.0,w=0.5; for(int i=0;i<4;i++){ a+=w*vnoise(p); p=p*2.03+vec2(17.3,9.1); w*=0.5; } return a; }
float fbmS(vec2 p){ float a=0.0,w=0.5; for(int i=0;i<3;i++){ a+=w*vnoise(p); p=p*2.03+vec2(17.3,9.1); w*=0.5; } return a; }
float fbm3(vec3 p){ float a=0.0,w=0.5; for(int i=0;i<4;i++){ a+=w*vnoise3(p); p=p*2.03+vec3(13.7,5.1,7.9); w*=0.5; } return a; }
float ridge(vec2 p){ return 1.0 - abs(2.0*fbm(p) - 1.0); }
vec2 vorF(vec2 p){                     // F1 distance + cell id hash
  vec2 i = floor(p), f = fract(p); float md = 8.0; float id = 0.0;
  for (int y=-1;y<=1;y++) for (int x=-1;x<=1;x++){
    vec2 g = vec2(float(x),float(y)); vec2 o = hash22(i+g);
    vec2 r = g + o - f; float d = dot(r,r);
    if (d < md){ md = d; id = hash12(i+g+7.0); }
  }
  return vec2(sqrt(md), id);
}
float vorEdge(vec2 p){
  vec2 i = floor(p), f = fract(p); float f1 = 8.0, f2 = 8.0;
  for (int y=-1;y<=1;y++) for (int x=-1;x<=1;x++){
    vec2 g = vec2(float(x),float(y));
    vec2 r = g + hash22(i+g) - f; float d = dot(r,r);
    if (d < f1){ f2 = f1; f1 = d; } else if (d < f2){ f2 = d; }
  }
  return sqrt(f2) - sqrt(f1);
}

vec4 bakeAt(vec3 wp, vec3 N){
  vec3 sp = (wp + N*0.30 - uVolMin) / uVolSize;
  return texture(uVol, clamp(sp, vec3(0.02), vec3(0.98)));
}
// blinn-phong lobe, energy-ish normalised
float lobe(vec3 N, vec3 L, vec3 V, float rough){
  vec3 h = normalize(L + V);
  float p = exp2(9.0*(1.0 - rough) + 1.0);
  return pow(max(dot(N,h),0.0), p) * (p + 8.0) * 0.045;
}
vec3 dynLight(vec3 alb, vec3 N, vec3 wp, vec3 V, float specA, float rough, vec3 lp, vec3 lc, float li){
  if (li < 0.004) return vec3(0.0);
  vec3 ld = lp - wp; float d2 = dot(ld,ld); ld *= inversesqrt(max(d2,1e-4));
  float att = li / (1.0 + d2*0.9);
  float ndl = max(dot(N, ld), 0.0);
  return alb*lc*att*ndl + lc*att*ndl*specA*lobe(N, ld, V, rough);
}
vec3 shade(vec3 alb, vec3 N, vec3 wp, float specA, float rough, float aoL){
  vec3 V = normalize(uCamPos - wp);
  vec4 bk = bakeAt(wp, N);
  float sunV = bk.r, ao = bk.g, fixV = bk.b, winV = bk.a;
  vec3 winDir = normalize(vec3(-0.38, 0.90, 0.0));       // daylight: laylights above + window wall
  vec3 col = alb * uSunCol * 4.4 * sunV * max(dot(N, uSunDir), 0.0);
  col += alb * uWinCol * 1.75 * winV * (max(dot(N, winDir), 0.0)*0.75 + 0.25);
  col += alb * uAmbCol * 1.15 * ao * (0.62 + 0.38*clamp(N.y*0.5+0.5, 0.0, 1.0));
  col += alb * uFixCol * 1.9 * fixV * uHouse;
  // speculars: sun + daylight sheen + fixtures-as-glints
  float fres = 0.05 + 0.95*pow(1.0 - max(dot(N, V), 0.0), 5.0);
  col += uSunCol * 4.4 * sunV * max(dot(N,uSunDir),0.0) * specA * fres * lobe(N, uSunDir, V, rough);
  col += uWinCol * 1.75 * winV * specA * fres * lobe(N, winDir, V, min(rough+0.18,1.0)) * 0.6;
  col += uFixCol * 1.9 * fixV * uHouse * specA * fres * lobe(N, normalize(vec3(0.2,1.0,0.1)), V, min(rough+0.25,1.0)) * 0.5;
  col += dynLight(alb, N, wp, V, specA, rough, uLampPos, vec3(1.0,0.58,0.24), uLampI*2.6);
  col += dynLight(alb, N, wp, V, specA, rough, uLectPos, vec3(1.0,0.84,0.58), uLectI*2.0);
  col *= aoL;
  // subtle interior depth haze, warm-dark
  float d = length(wp - uCamPos);
  col = mix(col, vec3(0.055,0.048,0.040)*(0.4+uHouse), 1.0 - exp(-d*d*0.00026));
  return col;
}
`;

const VERT_STD = /* glsl */`
out vec3 vWp; out vec3 vN; out vec2 vUv; out vec4 vData;
in vec4 aData;
void main(){
  vWp = (modelMatrix * vec4(position,1.0)).xyz;
  vN  = normalize(mat3(modelMatrix) * normal);
  vUv = uv; vData = aData;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
}
`;

// ── veined marble: fbm-warped ridged veins, per-pixel, three stone variants ──
const FRAG_MARBLE = /* glsl */`
${'${COMMON}'}
in vec3 vWp; in vec3 vN; in vec2 vUv; in vec4 vData;
out vec4 outColor;
void main(){
  vec3 N = normalize(vN);
  float variant = vData.y; float seed = vData.x;
  vec3 q = vWp * 1.35 + seed*19.0;
  // vein coordinates: big wall panels carry their size in aData.zw and are
  // BOOK-MATCHED (mirrored about the panel centre, like the hero photo);
  // everything else veins in world space
  vec2 pp;
  if (vData.z > 0.01) pp = vec2(abs(vUv.x - 0.5)*vData.z, vUv.y*vData.w)*0.85 + seed*7.0;
  else pp = q.xz*0.9 + vec2(q.y*0.55, q.y*0.31);
  vec2 warp = vec2(fbmS(pp*0.8 + 3.7), fbmS(pp*0.8 + 9.2));
  // dominant diagonal vein direction, as in the Pavonazzo slabs
  vec2 dg = vec2(pp.x*0.8 + pp.y*0.6, pp.x*0.25 - pp.y*0.9);
  float v1 = pow(clamp(ridge(dg*0.55 + warp*1.45), 0.0, 1.0), 7.0);
  float v2 = pow(clamp(ridge(pp*2.1 - warp*0.9 + 4.1), 0.0, 1.0), 13.0);
  float cloud = fbmS(pp*0.45 + warp*0.5);
  vec3 base, veinC;
  float polish;
  if (variant < 0.5) {           // Pavonazzo — walls, columns, window reveals
    base  = mix(${C3(P.marbleWhiteA)}, ${C3(P.marbleWhiteB)}, cloud*0.8);
    base *= 0.96 + 0.04*fbmS(pp*6.0);
    veinC = ${C3(0x6e6873)};
    base  = mix(base, veinC, clamp(v1*0.55 + v2*0.22, 0.0, 1.0));
    base  = mix(base, ${C3(0x8a8894)}, smoothstep(0.55,0.85,fbmS(dg*0.35+11.0))*v1*0.30);
    base  = mix(base, ${C3(0xbfa887)}, smoothstep(0.68,0.92,cloud)*0.10);  // faint warm sienna wash
    polish = 0.6;
  } else if (variant < 1.5) {    // red breccia — angular clasts in a cream matrix
    // dedicated planar coords so vertical faces get real 2-D cells, and a
    // rotated second domain so nothing lines up into stripes
    vec2 bq = vec2(vWp.x*0.85 + vWp.z*0.60 + vWp.y*0.22,
                   vWp.y*1.35 - vWp.x*0.28 + vWp.z*0.40) * 2.3 + seed*3.0;
    vec2 bf = vorF(bq);
    float clast = bf.y;
    float matrixLine = smoothstep(0.085, 0.015, vorEdge(bq));
    float subTone = fbmS(bq*0.7 + vec2(clast*13.0, 4.0));
    base  = mix(${C3(P.marbleRedA)}, ${C3(P.marbleRedB)}, clast*0.55 + subTone*0.30);
    base  = mix(base, ${C3(0x45201a)}, smoothstep(0.60,0.92,fbmS(bq*0.5+8.0))*0.28);
    base  = mix(base, ${C3(P.marbleRedVein)}, matrixLine*0.45);
    base  = mix(base, ${C3(0xc9a98a)}, smoothstep(0.80,0.95,subTone)*0.18); // pale clast faces
    polish = 0.85;
  } else {                       // verde antique — wall plinths, dark bases
    base  = mix(${C3(P.marbleVerdeA)}, ${C3(P.marbleVerdeB)}, cloud);
    veinC = ${C3(P.marbleVerdeVein)};
    base  = mix(base, veinC, v1*0.6 + v2*0.4);
    polish = 0.8;
  }
  // micro normal shimmer so polish reads as stone, not plastic
  float mn = vnoise3(q*22.0);
  vec3 Np = normalize(N + (mn-0.5)*0.05);
  // panel-edge wear: soften ao at authored uv borders
  float edge = min(min(vUv.x, 1.0-vUv.x), min(vUv.y, 1.0-vUv.y));
  float aoL = 0.82 + 0.18*smoothstep(0.0, 0.06, edge);
  vec3 col = shade(base, Np, vWp, polish, mix(0.34, 0.16, polish), aoL);
  outColor = vec4(col, 1.0);
}
`;

// ── wood grain: warped growth rings + fibre, mahogany/oak variants ──────────
const FRAG_WOOD = /* glsl */`
${'${COMMON}'}
in vec3 vWp; in vec3 vN; in vec2 vUv; in vec4 vData;
out vec4 outColor;
void main(){
  vec3 N = normalize(vN);
  float seed = vData.x, variant = vData.y;
  // world-space grain (per-piece seed offsets the log) — long fibres, wide
  // quiet ring bands, fine pores; calm like french-polished casework
  vec3 q = vWp*1.0 + seed*17.0;
  float axisC = q.x*0.32 + q.z*0.32 + q.y*1.9;         // grain runs along the piece
  float acrossC = q.x*0.9 - q.z*0.9 + q.y*0.22;
  float wob = fbm(vec2(axisC*0.5, acrossC*1.4));
  float rings = 0.5 + 0.5*sin(acrossC*9.0 + wob*4.5 + seed*40.0);
  rings = smoothstep(0.15, 0.85, rings);
  float fibre = vnoise(vec2(axisC*1.4, acrossC*26.0));
  float pore  = smoothstep(0.78, 0.95, vnoise(vec2(axisC*6.0, acrossC*60.0)));
  vec3 base;
  float gloss;
  if (variant < 0.5) {          // french-polished mahogany — bench, panelling
    base = mix(${C3(P.mahoganyA)}, ${C3(P.mahoganyB)}, rings*0.55 + wob*0.30);
    base = mix(base, ${C3(P.mahoganyC)}, smoothstep(0.62,0.95,fibre)*0.22);
    base *= 0.94 + 0.12*wob;
    base *= 1.0 - pore*0.18;
    gloss = 0.85;
  } else {                      // warmer waxed mahogany — pews, doors
    base = mix(${C3(P.oakA)}, ${C3(P.oakB)}, rings*0.5 + wob*0.35);
    base *= 0.92 + 0.16*fibre;
    base *= 1.0 - pore*0.15;
    gloss = 0.6;
  }
  // carved profile shadow via authored v: darken toward panel edges
  float edge = min(vUv.y, 1.0 - vUv.y);
  float aoL = 0.78 + 0.22*smoothstep(0.0, 0.10, edge);
  float mn = vnoise3(vWp*30.0 + seed);
  vec3 Np = normalize(N + (mn - 0.5)*0.04);
  vec3 col = shade(base, Np, vWp, gloss, mix(0.42, 0.13, gloss), aoL);
  outColor = vec4(col, 1.0);
}
`;

// ── mosaic: tesserae with mortar joints.  Three works, as in the photos:
//    0 — allegorical attic lunette (enthroned figure, orb, wings; FACELESS)
//    1 — white floor-tile band at the bar
//    2 — geometric diamond-lozenge panel behind the bench (non-identifying)
const FRAG_MOSAIC = /* glsl */`
${'${COMMON}'}
in vec3 vWp; in vec3 vN; in vec2 vUv; in vec4 vData;
out vec4 outColor;
void main(){
  vec3 N = normalize(vN);
  float variant = vData.y;
  // uv in tesserae space; zw carries the tile density per piece
  vec2 tp = vUv * vData.zw;
  vec2 vf = vorF(tp);
  float grout = smoothstep(0.02, 0.14, vorEdge(tp));
  float id = vf.y;
  vec3 tess;
  if (variant < 0.5) {
    // ── the lunette: sunset sky, tree line, enthroned figure with orb ──
    vec2 c = (vUv - vec2(0.5, 0.5)) * 2.0;    // x -1..1, y 0 at spring line
    float rr = length(c);
    float h = c.y;                            // height within the lunette
    // sky: gold sunset falling to orange at the tree line
    tess = mix(${C3(P.lunOrange)}, ${C3(P.lunSunset)}, smoothstep(0.28, 0.75, h + fbm(c*3.0)*0.12));
    tess = mix(tess, ${C3(0xead890)}, smoothstep(0.7, 1.0, h)*0.5);
    // dark blue-green tree band with an irregular crown
    float treeLine = 0.34 + 0.10*fbm(vec2(c.x*3.2, 1.7));
    tess = mix(tess, ${C3(P.lunTree)}, smoothstep(treeLine + 0.05, treeLine - 0.03, h));
    // olive foreground ground plane
    tess = mix(tess, ${C3(P.lunOlive)}, smoothstep(0.20, 0.10, h));
    // white throne bench behind the figure
    float bench = smoothstep(0.09, 0.05, abs(h - 0.30)) * step(abs(c.x), 0.52);
    tess = mix(tess, ${C3(P.lunErmine)}, bench*0.75);
    // eagle wings: two dark-russet arcs behind the head
    float wingR = length(vec2(abs(c.x) - 0.16, (h - 0.62)*1.6));
    float wings = smoothstep(0.30, 0.26, wingR) - smoothstep(0.20, 0.16, wingR);
    tess = mix(tess, ${C3(0x5e3226)}, clamp(wings, 0.0, 1.0)*step(0.55, h));
    // enthroned figure: violet robe falling in a broad triangle
    float robeW = mix(0.34, 0.10, smoothstep(0.14, 0.66, h));
    float robe = smoothstep(robeW + 0.03, robeW - 0.01, abs(c.x + 0.02*sin(h*9.0)));
    robe *= smoothstep(0.06, 0.12, h) * smoothstep(0.70, 0.62, h);
    tess = mix(tess, mix(${C3(P.lunPurple)}, ${C3(0x3a3550)}, fbm(c*5.0)), robe);
    // ermine-trimmed stole: two pale bands down the robe
    float stole = smoothstep(0.030, 0.012, abs(abs(c.x) - 0.10)) * robe;
    tess = mix(tess, ${C3(P.lunErmine)}, stole);
    // head: featureless flesh oval (NO facial features), small crown glint
    float headR = length(vec2(c.x, (h - 0.70)*1.5));
    tess = mix(tess, ${C3(P.lunFlesh)}, smoothstep(0.075, 0.055, headR));
    tess = mix(tess, ${C3(P.mosaicGoldB)}, smoothstep(0.022, 0.008, abs(h - 0.78))*step(abs(c.x), 0.055));
    // the orb: pale glass sphere held to the right
    float orbR = length(vec2(c.x - 0.26, (h - 0.40)*1.3));
    tess = mix(tess, mix(${C3(0xbdc8cc)}, ${C3(0xe8f0f2)}, smoothstep(0.05, 0.0, orbR)), smoothstep(0.055, 0.04, orbR));
    // kneeling attendants: russet mass left, blue-cloaked mass right
    float att1 = smoothstep(0.30, 0.05, length(vec2((c.x + 0.52)*1.3, (h - 0.22)*1.9)));
    tess = mix(tess, mix(${C3(P.lunRusset)}, ${C3(0x6e3a20)}, fbm(c*6.0 + 2.0)), att1*0.9);
    float att2 = smoothstep(0.30, 0.05, length(vec2((c.x - 0.52)*1.3, (h - 0.22)*1.9)));
    tess = mix(tess, mix(${C3(0x3a4a6a)}, ${C3(0x7c3428)}, smoothstep(0.3,0.7,fbm(c*4.0+7.0))), att2*0.9);
    // rim: single gold band following the arch
    tess = mix(tess, mix(${C3(P.mosaicGoldA)}, ${C3(P.mosaicGoldB)}, id), smoothstep(0.045, 0.015, abs(rr - 0.94)));
  } else if (variant < 1.5) {
    // ── floor band at the bar: small white tile, grey grout, red key line ──
    vec3 ivory = mix(${C3(P.mosaicIvory)}, ${C3(0xd7cdb4)}, id);
    tess = ivory;
    float lane = vUv.y;
    float border = smoothstep(0.16, 0.13, lane) + smoothstep(0.84, 0.87, lane);
    tess = mix(tess, mix(${C3(P.mosaicOx)}, ${C3(0x84382a)}, id), border);
    float key = step(0.80, sin(vUv.x*vData.z*0.55)*0.5+0.5) * smoothstep(0.10, 0.03, abs(lane-0.5));
    tess = mix(tess, ${C3(P.marbleVerdeA)}, key*0.85);
  } else {
    // ── diamond-lozenge panel: concentric rhombi, gold ground.  Purely
    //    geometric — deliberately carries no name, arms or seal. ──
    vec2 c = abs(vUv - 0.5) * 2.0;
    float d = c.x + c.y*1.15;                    // L1 diamond radius
    vec3 gold = mix(${C3(P.mosaicGoldA)}, ${C3(P.mosaicGoldB)}, id);
    float facet = 0.88 + 0.30*hash12(vec2(id*91.0, id*57.0));
    tess = gold * facet;
    // border frames near the panel edge
    float e = max(c.x, c.y);
    tess = mix(tess, mix(${C3(P.mosaicGreen)}, ${C3(0x49795c)}, id), smoothstep(0.025,0.008,abs(e-0.90)));
    // concentric diamond REGIONS (filled bands, as the photo's lozenge)
    float band1 = smoothstep(0.74, 0.72, d) - smoothstep(0.58, 0.56, d);
    tess = mix(tess, mix(${C3(P.mosaicGreen)}, ${C3(0x2e4636)}, id), clamp(band1, 0.0, 1.0));
    float band2 = smoothstep(0.58, 0.56, d) - smoothstep(0.46, 0.44, d);
    tess = mix(tess, mix(${C3(P.mosaicIvory)}, ${C3(0xd7cdb4)}, id), clamp(band2, 0.0, 1.0));
    float band3 = smoothstep(0.46, 0.44, d) - smoothstep(0.30, 0.28, d);
    tess = mix(tess, mix(${C3(P.mosaicOx)}, ${C3(0x84382a)}, id), clamp(band3, 0.0, 1.0));
    tess = mix(tess, mix(${C3(P.mosaicBlue)}, ${C3(0x35567a)}, id), step(d, 0.29));
    tess = mix(tess, mix(${C3(P.mosaicGoldA)}, ${C3(P.mosaicGoldB)}, id) * 1.1, smoothstep(0.13, 0.10, d));
  }
  tess *= 0.6 + 0.4*grout;                                   // mortar shadow
  vec3 groutC = ${C3(0x9a9188)} * 0.6;
  vec3 alb = mix(groutC, tess, grout);
  // tesserae facets: perturb normal per cell so gold glitters
  vec2 fh = hash22(vec2(id*127.0, id*311.0)) - 0.5;
  vec3 Np = normalize(N + vec3(fh.x, fh.y, fh.x)*0.15*grout);
  float spec = (variant < 1.5 ? 0.55 : 0.85) * grout;
  vec3 col = shade(alb, Np, vWp, spec, 0.24, 1.0);
  outColor = vec4(col, 1.0);
}
`;

// ── aged brass / gilt: patina in crevices, strong warm fresnel ──────────────
const FRAG_BRASS = /* glsl */`
${'${COMMON}'}
in vec3 vWp; in vec3 vN; in vec2 vUv; in vec4 vData;
out vec4 outColor;
void main(){
  vec3 N = normalize(vN);
  float seed = vData.x;
  vec3 q = vWp*7.0 + seed;
  float pat = fbm3(q*0.9);
  float tarn = smoothstep(0.42, 0.85, fbm3(q*2.1 + 4.0));
  vec3 base = mix(${C3(P.brassB)}, ${C3(P.brassA)}, tarn*0.8);
  base = mix(base, ${C3(0x3e2c12)}, smoothstep(0.65,0.95,pat)*0.35);
  float mn = fbm3(q*3.0);
  vec3 Np = normalize(N + (mn-0.5)*0.10*vec3(1.0,0.6,1.0));
  float spec = mix(1.0, 0.35, tarn);
  vec3 col = shade(base, Np, vWp, spec, mix(0.10, 0.42, tarn), 1.0);
  // metals tint their reflections
  col *= vec3(1.06, 0.97, 0.82);
  outColor = vec4(col, 1.0);
}
`;

// ── oxblood leather: voronoi wrinkle + sheen ────────────────────────────────
const FRAG_LEATHER = /* glsl */`
${'${COMMON}'}
in vec3 vWp; in vec3 vN; in vec2 vUv; in vec4 vData;
out vec4 outColor;
void main(){
  vec3 N = normalize(vN);
  float seed = vData.x, variant = vData.y;
  vec2 lp = vUv*vec2(26.0, 22.0) + seed*13.0;
  float mottle = fbm(lp*0.5 + 7.0);
  // wrinkle voronoi only where a variant actually uses it (carpet skips it)
  float crease = (variant < 0.5 || variant > 1.5) ? smoothstep(0.16, 0.02, vorEdge(lp)) : 0.0;
  vec3 base;
  float spec;
  if (variant < 0.5) {          // black chair leather (the bench chairs)
    base = mix(${C3(P.leatherB)}, ${C3(P.leatherA)}, mottle);
    base *= 1.0 - crease*0.45;
    base = mix(base, ${C3(0x3c4046)}, smoothstep(0.70,0.95,mottle)*0.35);  // worn sheen patches
    spec = 0.65;
  } else if (variant < 1.5) {   // grey-blue carpet — matte wool, faint mottle
    base = mix(${C3(P.carpetA)}, ${C3(P.carpetB)}, mottle);
    float fig = smoothstep(0.4,0.6, sin(vUv.x*140.0)*sin(vUv.y*300.0)*0.5+0.5);
    base = mix(base, ${C3(0x707d76)}, fig*0.10);
    base *= 0.92 + 0.16*vnoise(lp*3.0);
    spec = 0.04;
  } else if (variant < 2.5) {   // book cloth covers — colour drift per book
    vec3 shelf = mix(${C3(0x4e2a1c)}, ${C3(0x2e3a2e)}, step(0.5, fract(seed*3.7)));
    shelf = mix(shelf, ${C3(0x54321e)}, fract(seed*7.3)*0.5);
    base = shelf * (0.85 + 0.3*mottle);
    base *= 1.0 - crease*0.2;
    spec = 0.25;
  } else {                      // oxblood leather desk inlay
    base = mix(${C3(0x62241d)}, ${C3(0x3c1512)}, mottle);
    base *= 1.0 - crease*0.3;
    base = mix(base, ${C3(0x7c3428)}, smoothstep(0.72,0.95,mottle)*0.3);
    spec = 0.5;
  }
  vec3 Np = normalize(N + (fbm(lp*2.0)-0.5)*0.10);
  vec3 col = shade(base, Np, vWp, spec, 0.42, 0.92);
  outColor = vec4(col, 1.0);
}
`;

// ── plaster: matte lime, faint trowel mottle ────────────────────────────────
const FRAG_PLASTER = /* glsl */`
${'${COMMON}'}
in vec3 vWp; in vec3 vN; in vec2 vUv; in vec4 vData;
out vec4 outColor;
void main(){
  vec3 N = normalize(vN);
  vec3 q = vWp*1.1;
  float mott = fbm(q.xy*1.4 + q.z*0.7);
  vec3 base = mix(${C3(P.plasterA)}, ${C3(P.plasterB)}, mott*0.45);
  base *= 0.97 + 0.03*vnoise3(q*9.0);
  float age = smoothstep(0.65, 0.95, fbm(q.xz*0.5 + 3.0));
  base = mix(base, ${C3(0xc4b28e)}, age*0.07);
  // cast-ornament read on the big cove: low-frequency panel banding and
  // rosette bumps, shaded via ao + a slight normal ripple
  float orn = 0.0;
  if (vWp.y > 6.9) {
    float bandZ = 0.5 + 0.5*cos(vWp.z*3.4);
    float bandX = 0.5 + 0.5*cos(vWp.x*2.6 + 1.3);
    float ros = smoothstep(0.55, 0.9, vnoise(vWp.xz*1.7 + 5.0));
    orn = smoothstep(0.78, 0.96, bandZ)*0.5 + smoothstep(0.80, 0.97, bandX)*0.35 + ros*0.30;
    base *= 1.0 + orn*0.055;
    N = normalize(N + vec3(sin(vWp.z*3.4)*0.03, 0.0, sin(vWp.x*2.6)*0.025)*(1.0+orn));
  }
  float edge = min(min(vUv.x,1.0-vUv.x), min(vUv.y,1.0-vUv.y));
  float aoL = (0.84 + 0.16*smoothstep(0.0, 0.08, edge)) * (1.0 - orn*0.10);
  vec3 col = shade(base, N, vWp, 0.06, 0.8, aoL);
  outColor = vec4(col, 1.0);
}
`;

// ── paper / white linen (documents, judge's collar, book pages) ─────────────
const FRAG_PAPER = /* glsl */`
${'${COMMON}'}
in vec3 vWp; in vec3 vN; in vec2 vUv; in vec4 vData;
out vec4 outColor;
void main(){
  vec3 N = normalize(vN);
  float seed = vData.x;
  vec3 base = ${C3(P.paperA)};
  base *= 0.93 + 0.07*vnoise(vUv*40.0 + seed*9.0);
  // faint ruled text lines on document sheets (variant 0), plain linen (1)
  if (vData.y < 0.5) {
    float line = step(0.72, fract(vUv.y*26.0 + seed)) * step(0.08+0.3*hash12(vec2(floor(vUv.y*26.0), seed)), vUv.x) * step(vUv.x, 0.92);
    base *= 1.0 - line*0.22;
  }
  base *= 0.9 + 0.1*fbm(vUv*6.0 + seed);
  vec3 col = shade(base, N, vWp, 0.05, 0.85, 0.95);
  outColor = vec4(col, 1.0);
}
`;

// ── judge's robe: near-black wool, velvet fresnel rim ───────────────────────
const FRAG_ROBE = /* glsl */`
${'${COMMON}'}
in vec3 vWp; in vec3 vN; in vec2 vUv; in vec4 vData;
out vec4 outColor;
void main(){
  vec3 N = normalize(vN);
  vec3 V = normalize(uCamPos - vWp);
  float folds = fbm(vec2(vUv.x*9.0, vUv.y*3.5));
  vec3 base = ${C3(P.robeA)} * (0.8 + 0.5*folds);
  // velvet: strong grazing retro-reflection picks the silhouette out of shadow
  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
  vec3 col = shade(base, N, vWp, 0.10, 0.9, 0.9);
  col += ${C3(0x37364a)} * rim * (0.14 + 0.5*bakeAt(vWp,N).a);
  outColor = vec4(col, 1.0);
}
`;

// ── window glass: HDR sky + leading silhouette (emissive, drives the bake) ──
const FRAG_GLASS = /* glsl */`
${'${COMMON}'}
in vec3 vWp; in vec3 vN; in vec2 vUv; in vec4 vData;
out vec4 outColor;
void main(){
  // as the hero photo: luminous white blinds over the lower sash, deep
  // blue-violet stained glass in the arch above the transom
  float h = clamp(vUv.y, 0.0, 1.0);
  vec3 blind = vec3(5.2, 5.1, 4.7);
  blind *= 0.90 + 0.10*sin(vUv.y*90.0 + vData.x);            // slat ripple
  blind *= 0.94 + 0.06*vnoise(vUv*vec2(9.0, 3.0) + vData.x);
  vec3 stain = mix(vec3(0.7, 0.9, 2.6), vec3(1.7, 1.1, 2.9), vnoise(vUv*vec2(7.0,5.0)+vData.x));
  stain *= 0.75 + 0.45*vnoise(vUv*vec2(22.0, 26.0) + vData.x*3.0);
  float arch = smoothstep(0.70, 0.74, h);
  vec3 sky = mix(blind, stain, arch);
  outColor = vec4(sky * 1.25, 1.0);
}
`;

// ── lamp glass (bench lamp shade + fixture globes) — emissive, dynamic ──────
const FRAG_LAMPGLASS = /* glsl */`
${'${COMMON}'}
in vec3 vWp; in vec3 vN; in vec2 vUv; in vec4 vData;
out vec4 outColor;
void main(){
  vec3 N = normalize(vN);
  float kind = vData.y;   // 0 marquee bulb (house) · 1 bench lamp shade (amp) · 2 lectern pendant · 3 laylight panel
  vec3 col;
  if (kind < 0.5) {
    vec3 warm = vec3(1.0, 0.72, 0.38);
    float glow = uHouse;
    col = warm * (0.15 + 7.0*glow);
  } else if (kind > 2.5) {
    // laylight: broad cool daylight panel behind ornamented frames
    vec3 day = vec3(0.88, 0.92, 1.0);
    float pane = 0.88 + 0.12*smoothstep(0.02, 0.06, min(fract(vUv.x*6.0), fract(vUv.y*4.0)));
    col = day * 3.1 * pane * (0.92 + 0.08*vnoise(vUv*14.0));
  } else if (kind < 1.5) {
    // brass-banker's-lamp green glass: transmits green, hot rim below
    vec3 green = vec3(0.10, 0.55, 0.28);
    float hot = smoothstep(0.35, 0.0, vUv.y);
    col = green * (0.10 + 7.5*uLampI) + vec3(1.0,0.72,0.35)*hot*6.5*uLampI;
  } else {
    col = vec3(1.0, 0.85, 0.58) * (0.06 + 5.0*uLectI);
  }
  // shell still receives a hint of room light so it never reads pure black
  col += shade(vec3(0.06), N, vWp, 0.4, 0.3, 1.0)*0.4;
  outColor = vec4(col, 1.0);
}
`;

// ── volumetric light shafts: prisms extruded from the windows ───────────────
const VERT_SHAFT = /* glsl */`
out vec3 vWp; out vec3 vLoc;
in vec4 aData;
out vec4 vData;
void main(){
  vWp = (modelMatrix * vec4(position,1.0)).xyz;
  vLoc = vec3(uv, aData.z);           // u across window, v along the beam 0..1
  vData = aData;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
}
`;
const FRAG_SHAFT = /* glsl */`
${'${COMMON}'}
in vec3 vWp; in vec3 vLoc; in vec4 vData;
out vec4 outColor;
void main(){
  vec3 V = normalize(vWp - uCamPos);
  float along = vLoc.y;
  // beam fades with travel and toward the sheet edges
  float rim = pow(max(sin(3.14159*clamp(vLoc.x, 0.0, 1.0)), 0.0), 1.5) * vLoc.z;
  float body = exp(-along*2.1);
  // drifting dust density: slow diagonal churn through the beam
  vec3 dp = vWp*vec3(0.5, 0.35, 0.5) + vec3(uTime*0.010, -uTime*0.017, uTime*0.006);
  float dust = fbm3(dp*2.6);
  dust = 0.35 + 0.65*smoothstep(0.30, 0.78, dust);
  // stronger when looking up-beam into the light; never wash the lens
  // (V is camera→fragment; looking INTO the light means V ≈ uSunDir)
  float toward = pow(max(dot(V, uSunDir), 0.0), 2.5);
  float nearF = smoothstep(0.6, 2.4, length(vWp - uCamPos));
  float i = rim * body * dust * (0.30 + 0.80*toward) * nearF;
  vec3 col = uSunCol * vec3(1.0, 0.93, 0.80) * i * 0.45;
  outColor = vec4(col, 1.0);
}
`;

// ── dust motes: seeded points drifting inside the shafts ────────────────────
const VERT_MOTE = /* glsl */`
uniform float uTime2; uniform float uPix;
in float aSeed;
in float aFade;
out float vA;
void main(){
  vec3 p = position;
  float s = aSeed*43.7;
  float t = uTime2*0.55;
  p.x += sin(t*0.31 + s)*0.22 + sin(t*0.83 + s*2.7)*0.06;
  p.y += sin(t*0.23 + s*1.7)*0.30 - fract(s*0.371 + t*0.013)*1.2 + 0.6;
  p.z += cos(t*0.27 + s*3.1)*0.22;
  vec4 mv = viewMatrix * vec4(p, 1.0);
  float d = -mv.z;
  gl_PointSize = clamp(uPix*2.4/max(d,0.5), 0.75, 2.6);
  vA = (0.5 + 0.5*sin(t*1.3 + s*17.0)) * aFade;   // die with the beam body
  gl_Position = projectionMatrix * mv;
}
`;
const FRAG_MOTE = /* glsl */`
precision highp float;
uniform vec3 uSunCol;
in float vA;
out vec4 outColor;
void main(){
  vec2 c = gl_PointCoord*2.0 - 1.0;
  float a = smoothstep(1.0, 0.15, length(c));
  outColor = vec4(uSunCol*vec3(1.0,0.94,0.8)*2.2, a*vA*0.42);
}
`;

// ── post: adaptive exposure → ACES → grade → vignette → grain → gamma ───────
const VERT_POST = /* glsl */`
out vec2 vUvP;
void main(){ vUvP = position.xy*0.5 + 0.5; gl_Position = vec4(position.xy, 1.0, 1.0); }
`;
const FRAG_POST = /* glsl */`
precision highp float;
uniform sampler2D tScene;
uniform float uExposure, uT;
in vec2 vUvP;
out vec4 outColor;
float phash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec3 aces(vec3 x){ return clamp(x*(2.51*x+0.03)/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
void main(){
  vec3 c = texture(tScene, vUvP).rgb;
  c *= uExposure;
  c = aces(c);
  c = pow(c, vec3(1.015, 1.0, 0.982));               // gentle warm grade
  float r = length(vUvP - 0.5);
  c *= 1.0 - 0.34*r*r - 0.10*r*r*r*r;                // vignette
  c += (phash(vUvP*vec2(1913.0,1021.0) + fract(uT)*7.0) - 0.5)*0.0085;  // grain
  c = pow(max(c, vec3(0.0)), vec3(1.0/2.2));
  outColor = vec4(c, 1.0);
}
`;
const FRAG_LUM = /* glsl */`
precision highp float;
uniform sampler2D tScene;
out vec4 outColor;
void main(){
  vec3 s = vec3(0.0);
  for (int i=0;i<4;i++) for (int j=0;j<4;j++)
    s += texture(tScene, vec2(0.2 + 0.2*float(i), 0.25 + 0.17*float(j))).rgb;
  s /= 16.0;
  float l = dot(s, vec3(0.2126, 0.7152, 0.0722));
  outColor = vec4(l/(1.0+l), 0.0, 0.0, 1.0);
}
`;

// ═══════════════════════════════════════════════════════════════════════════
//  GEOMETRY KIT — everything is merged into one draw per material.
// ═══════════════════════════════════════════════════════════════════════════
const occluders = [];   // AABBs registered for the bake
function occlude(cx, cy, cz, sx, sy, sz) {
  occluders.push([cx - sx/2, cy - sy/2, cz - sz/2, cx + sx/2, cy + sy/2, cz + sz/2]);
}

class Merger {
  constructor() { this.pos = []; this.nrm = []; this.uv = []; this.data = []; }
  add(geom, matrix, data = [0, 0, 0, 0]) {
    const g = geom.index ? geom.toNonIndexed() : geom;
    const p = g.attributes.position, n = g.attributes.normal, u = g.attributes.uv;
    const nm = new THREE.Matrix3().getNormalMatrix(matrix);
    const v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i).applyMatrix4(matrix);
      this.pos.push(v.x, v.y, v.z);
      v.fromBufferAttribute(n, i).applyMatrix3(nm).normalize();
      this.nrm.push(v.x, v.y, v.z);
      if (u) this.uv.push(u.getX(i), u.getY(i)); else this.uv.push(0, 0);
      this.data.push(data[0], data[1], data[2], data[3]);
    }
    if (g !== geom) g.dispose();
  }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nrm, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    g.setAttribute('aData', new THREE.Float32BufferAttribute(this.data, 4));
    return g;
  }
}
const M4 = () => new THREE.Matrix4();
function mat(x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  const m = M4();
  m.makeRotationFromEuler(new THREE.Euler(rx, ry, rz));
  m.scale(new THREE.Vector3(sx, sy, sz));
  m.setPosition(x, y, z);
  return m;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (rt, rb, h, seg = 14) => new THREE.CylinderGeometry(rt, rb, h, seg);
const sph = (r, w = 12, h = 10) => new THREE.SphereGeometry(r, w, h);
function lathe(profile, seg = 16) {
  return new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), seg);
}
// classical moulding run: stacked steps along one wall segment
function moulding(merger, x, y, z, len, axis, steps, data) {
  for (const [dy, h, depth] of steps) {
    const m = axis === 'x' ? mat(x, y + dy, z, 0, 0, 0, len, h, depth)
                           : mat(x, y + dy, z, 0, Math.PI / 2, 0, len, h, depth);
    merger.add(box(1, 1, 1), m, data);
  }
}

// arched window opening outline (also reused for shaft prism cross-section)
function archPoints(w, sill, spring, r, n = 7) {
  const pts = [];
  pts.push([-w/2, sill], [w/2, sill], [w/2, spring]);
  for (let i = 1; i <= n; i++) {
    const a = (i / (n + 1)) * Math.PI;
    pts.push([Math.cos(a) * w/2, spring + Math.sin(a) * r]);
  }
  pts.push([-w/2, spring]);
  return pts;
}

// ═══════════════════════════════════════════════════════════════════════════
//  PresenceScene
// ═══════════════════════════════════════════════════════════════════════════
const CEREMONY_STATES = ['IDLE', 'RISING', 'AWAITING', 'COURT_SPEAKING', 'ADJOURNED'];

// pure ceremony reducer: (state, event) → state.  Visuals NEVER read events —
// they derive from the current state alone (deriveTargets below).
function ceremonyReduce(state, event) {
  switch (event.type) {
    case 'SET_STATE':     return CEREMONY_STATES.includes(event.state) ? event.state : state;
    case 'CALL_TO_ORDER': return state === 'IDLE' || state === 'ADJOURNED' ? 'RISING' : state;
    case 'JUDGE_SEATED':  return state === 'RISING' ? 'AWAITING' : state;
    case 'COURT_SPEAKS':  return state === 'AWAITING' ? 'COURT_SPEAKING' : state;
    case 'YIELD_FLOOR':   return state === 'COURT_SPEAKING' ? 'AWAITING' : state;
    case 'ADJOURN':       return state === 'ADJOURNED' ? state : 'ADJOURNED';
    case 'RESET':         return 'IDLE';
    default:              return state;
  }
}
// pure: current state → visual targets.  Amp is applied separately (and only
// gates the bench lamp during COURT_SPEAKING — amp 0 kills it instantly).
function deriveTargets(state) {
  switch (state) {
    case 'IDLE':           return { judgeY: -1.05, judgeLean: 0.00, house: 0.42, lect: 0.0, lampFloor: 0.0, exposure: 1.16 };
    case 'RISING':         return { judgeY:  0.17, judgeLean: 0.00, house: 0.95, lect: 0.0, lampFloor: 0.04, exposure: 1.06 };
    case 'AWAITING':       return { judgeY:  0.00, judgeLean: 0.04, house: 0.88, lect: 1.0, lampFloor: 0.05, exposure: 1.04 };
    case 'COURT_SPEAKING': return { judgeY:  0.00, judgeLean: 0.10, house: 0.70, lect: 0.32, lampFloor: 0.0, exposure: 1.02 };
    case 'ADJOURNED':      return { judgeY: -1.05, judgeLean: 0.00, house: 0.16, lect: 0.0, lampFloor: 0.0, exposure: 1.28 };
    default:               return { judgeY: -1.05, judgeLean: 0.00, house: 0.42, lect: 0.0, lampFloor: 0.0, exposure: 1.16 };
  }
}

class PresenceScene {
  constructor({ container, clock } = {}) {
    this.clock = clock || RealClock();
    this.container = container || document.body;
    this.state = 'IDLE';
    this.amp = 0;
    this.transcript = [];
    this.cur = { ...deriveTargets('IDLE') };   // eased-toward copies of targets
    this.exposure = this.cur.exposure;
    this.bakeMs = 0;
    this.fps = 0;
    this._fpsAcc = 0; this._fpsN = 0;
    this._lampPos = new THREE.Vector3(1.25, 2.72, -7.41);
    this._lectPos = new THREE.Vector3(0, 3.4, 1.9);
    this._frozen = false;
  }

  // ── public seams ──────────────────────────────────────────────────────────
  setAmp(a) { this.amp = Math.min(1, Math.max(0, a)); }
  setState(s) { const next = ceremonyReduce(this.state, { type: 'SET_STATE', state: s }); this._enter(next); }
  dispatch(event) { this._enter(ceremonyReduce(this.state, event)); }
  loadEnvironment(asset) {
    // STUB — future: replace this.staticEnv with a baked-lighting splat asset;
    // the dynamic rig (this.rig) composites over whatever environment is set.
    console.info('[PresenceScene] loadEnvironment stub', asset);
    return Promise.resolve(false);
  }
  pushTranscript(line) {
    // STUB — future: line-by-line transcript rendering surface.
    this.transcript.push(String(line));
    const el = document.getElementById('transcript');
    if (el) el.textContent = this.transcript.slice(-1)[0];
  }
  _enter(next) {
    if (next === this.state) return;
    this.state = next;
    this.stateEnteredAt = this.clock.now();
    document.querySelectorAll('#ui button[data-state]').forEach(b =>
      b.classList.toggle('active', b.dataset.state === this.state));
  }

  // ── boot ──────────────────────────────────────────────────────────────────
  async init() {
    const setLoad = (f, msg) => {
      document.getElementById('loadbar').style.width = `${(f * 100) | 0}%`;
      if (msg) document.getElementById('loadmsg').textContent = msg;
      return new Promise(r => requestAnimationFrame(r));
    };
    await setLoad(0.02, 'raising the walls…');

    const renderer = this.renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.autoClear = true;
    this.container.appendChild(renderer.domElement);

    const scene = this.scene = new THREE.Scene();
    this.staticEnv = new THREE.Group(); this.staticEnv.name = 'staticEnvironment';
    this.rig = new THREE.Group();       this.rig.name = 'dynamicRig';
    scene.add(this.staticEnv, this.rig);

    const camera = this.camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 80);
    camera.position.set(0.42, 1.78, 3.30);          // the advocate, at the podium
    camera.lookAt(0.0, 3.80, -8.6);                 // bench + aedicule + far laylight in frame

    // ── shared uniforms (one object → every material updates at once) ──────
    const G = this.G = {
      uTime:   { value: 0 },
      uVol:    { value: null },
      uVolMin: { value: new THREE.Vector3(ROOM.x0, ROOM.y0, ROOM.z0) },
      uVolSize:{ value: new THREE.Vector3(ROOM.x1 - ROOM.x0, ROOM.y1 - ROOM.y0, ROOM.z1 - ROOM.z0) },
      uSunDir: { value: SUN_DIR },
      uSunCol: { value: new THREE.Vector3(...P.sunCol) },
      uWinCol: { value: new THREE.Vector3(...P.winCol) },
      uAmbCol: { value: new THREE.Vector3(...P.ambCol) },
      uFixCol: { value: new THREE.Vector3(...P.fixCol) },
      uHouse:  { value: 0.42 },
      uLampPos:{ value: this._lampPos },
      uLampI:  { value: 0 },
      uLectPos:{ value: this._lectPos },
      uLectI:  { value: 0 },
      uCamPos: { value: camera.position },
    };

    const common = GLSL_COMMON;
    const mkMat = (frag, extra = {}, opts = {}) => new THREE.ShaderMaterial({
      glslVersion: THREE.GLSL3,
      vertexShader: opts.vert || VERT_STD,
      fragmentShader: frag.replace('${COMMON}', common),
      uniforms: { ...G, ...extra },
      ...opts.mat,
    });

    const MATS = this.MATS = {
      marble:  mkMat(FRAG_MARBLE),
      wood:    mkMat(FRAG_WOOD),
      mosaic:  mkMat(FRAG_MOSAIC),
      brass:   mkMat(FRAG_BRASS),
      leather: mkMat(FRAG_LEATHER),
      plaster: mkMat(FRAG_PLASTER),
      paper:   mkMat(FRAG_PAPER),
      robe:    mkMat(FRAG_ROBE),
      glass:   mkMat(FRAG_GLASS),
      lamp:    mkMat(FRAG_LAMPGLASS),
    };

    await setLoad(0.06, 'quarrying the marble…');
    this._buildRoom(MATS);
    await setLoad(0.16, 'joining the mahogany…');
    this._buildFurniture(MATS);
    this._buildRig(MATS);
    this._buildAtmosphere(mkMat);

    // depth-prepass kit: opaque meshes get a colour-write-off pass first so
    // early-Z rejects hidden fragments before the expensive shaders run.
    // CRITICAL: it must use VERT_STD so its depth is bit-identical to the
    // colour pass (a different vertex chain would z-fight at EQUAL depth).
    this._depthMat = new THREE.ShaderMaterial({
      glslVersion: THREE.GLSL3,
      vertexShader: VERT_STD,
      fragmentShader: 'precision highp float; out vec4 o; void main(){ o = vec4(0.0); }',
    });
    this._depthMat.colorWrite = false;
    this._transparents = [];
    scene.traverse(o => {
      if ((o.isMesh || o.isPoints) && (o.isPoints || (o.material && o.material.transparent)))
        this._transparents.push(o);
    });

    // ── bake the light volume ───────────────────────────────────────────────
    const t0 = performance.now();
    await this._bakeLightVolume(setLoad);
    this.bakeMs = Math.round(performance.now() - t0);

    // ── post pipeline ───────────────────────────────────────────────────────
    this.sceneRT = new THREE.WebGLRenderTarget(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio(), {
      type: THREE.HalfFloatType, samples: 4, depthBuffer: true,
    });
    this.lumRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.UnsignedByteType });
    const triangle = new THREE.BufferGeometry();
    triangle.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
    this.postMat = new THREE.ShaderMaterial({
      glslVersion: THREE.GLSL3, vertexShader: VERT_POST, fragmentShader: FRAG_POST,
      uniforms: { tScene: { value: this.sceneRT.texture }, uExposure: { value: 1.0 }, uT: { value: 0 } },
      depthTest: false, depthWrite: false,
    });
    this.lumMat = new THREE.ShaderMaterial({
      glslVersion: THREE.GLSL3, vertexShader: VERT_POST, fragmentShader: FRAG_LUM,
      uniforms: { tScene: { value: this.sceneRT.texture } },
      depthTest: false, depthWrite: false,
    });
    this.postScene = new THREE.Scene();
    this.postQuad = new THREE.Mesh(triangle, this.postMat);
    this.postQuad.frustumCulled = false;
    this.postScene.add(this.postQuad);
    this.postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this._lumPix = new Uint8Array(4);
    this._frame = 0;

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));   // window may move across monitors
      renderer.setSize(innerWidth, innerHeight);
      const pr = renderer.getPixelRatio();
      this.sceneRT.setSize(innerWidth * pr, innerHeight * pr);
      if (this._moteMat) this._moteMat.uniforms.uPix.value = innerHeight * pr * 0.5;
    });

    await setLoad(1.0, 'court is assembled');
    document.getElementById('loader').classList.add('done');
  }

  // ═════════════════════════════════════════════════════════════════════════
  //  STATIC ENVIRONMENT
  // ═════════════════════════════════════════════════════════════════════════
  _buildRoom(MATS) {
    const rng = mulberry32(4021);
    const marble = new Merger(), wood = new Merger(), plaster = new Merger(),
          brass = new Merger(), mosaic = new Merger(), glass = new Merger(),
          lampGlass = new Merger();
    const { x0, x1, y0, y1, z0, z1 } = ROOM;
    const W = x1 - x0, D = z1 - z0;
    const { ent0, ent1, att1, cor1, flatY, coveW } = CEIL;

    // ── floor slab; carpet, tile band and curbs dress it (furniture pass) ──
    marble.add(box(W, 0.2, D), mat(0, -0.1, 0), [0, 0, 0, 0]);
    occlude(0, -0.1, 0, W, 0.2, D);
    mosaic.add(box(W - 1.0, 0.204, 0.62), mat(0, -0.098, 3.62), [0, 1, 340, 10]);
    for (const dz of [-0.42, 0.42])
      marble.add(box(W - 1.0, 0.206, 0.14), mat(0, -0.097, 3.62 + dz), [1, 1, 0, 0]);

    // ── walls: full-height book-matched Pavonazzo over a verde plinth,
    //    arcade of engaged columns → entablature → attic with herms →
    //    bracketed cornice (the hero photo's wall section) ──────────────────
    const bayPitch = 2.85;
    const wallDefs = [
      { axis: 'z', at: z0, a0: x0, a1: x1, sign: 1 },   // behind the bench
      { axis: 'z', at: z1, a0: x0, a1: x1, sign: -1 },  // behind the gallery
      { axis: 'x', at: x1, a0: z0, a1: z1, sign: -1 },  // right wall
      { axis: 'x', at: x0, a0: z0, a1: z1, sign: 1 },   // window wall
    ];
    for (const wd of wallDefs) {
      const { axis, at, a0, a1, sign } = wd;
      const len = a1 - a0, mid = (a0 + a1) / 2;
      const T = 0.24;
      const isWinWall = axis === 'x' && at === x0;
      const place = (c, y, wAlong, h, depth, data, mg = marble) => {
        const m = axis === 'z'
          ? mat(c, y, at + sign * depth / 2, 0, 0, 0, wAlong, h, depth)
          : mat(at + sign * depth / 2, y, c, 0, Math.PI / 2, 0, wAlong, h, depth);
        mg.add(box(1, 1, 1), m, data);
      };
      // backing sheet to attic top (window wall: in segments around openings)
      if (isWinWall) {
        const edges = [a0];
        for (const w of WINDOWS) edges.push(w.z - 0.95, w.z + 0.95);
        edges.push(a1);
        for (let s = 0; s < edges.length; s += 2) {
          const sa = edges[s], sb = edges[s + 1];
          place((sa + sb) / 2, att1 / 2, sb - sa, att1, T, [rng() * 9, 0, sb - sa, att1]);
          occlude(at + 0.17, y1 / 2, (sa + sb) / 2, 0.6, y1 * 2, sb - sa);
        }
        for (const w of WINDOWS) {
          const topY = w.spring + w.r;
          place(w.z, w.sill / 2, 1.9, w.sill, T, [rng() * 9, 0, 0, 0]);
          occlude(at + 0.17, w.sill / 2, w.z, 0.6, w.sill, 1.9);
          place(w.z, (topY + att1) / 2, 1.9, att1 - topY, T, [rng() * 9, 0, 0, 0]);
          occlude(at + 0.17, (topY + att1) / 2, w.z, 0.6, att1 - topY, 1.9);
          occlude(at + 0.17, w.spring + w.r * 0.85, w.z - w.w * 0.40, 0.6, w.r * 0.45, w.w * 0.22);
          occlude(at + 0.17, w.spring + w.r * 0.85, w.z + w.w * 0.40, 0.6, w.r * 0.45, w.w * 0.22);
        }
      } else {
        place(mid, att1 / 2, len, att1, T, [rng() * 9, 0, len, att1]);
        if (axis === 'z') occlude(mid, y1 / 2, at, len, y1 * 2, 0.5);
        else occlude(at, y1 / 2, mid, 0.5, y1 * 2, len);
      }
      // verde plinth
      place(mid, 0.26, len, 0.52, T + 0.06, [rng() * 9, 2, 0, 0]);
      // arcade bays: book-matched panels + engaged columns with capitals
      const n = Math.max(3, Math.round(len / bayPitch));
      const bw = len / n;
      for (let i = 0; i < n; i++) {
        const c = a0 + (i + 0.5) * bw;
        const nearWin = isWinWall && WINDOWS.some(w => Math.abs(c - w.z) < 1.25);
        if (!nearWin) {
          place(c, 2.85, bw - 0.78, 4.1, T + 0.03, [rng() * 9, 0, bw - 0.78, 4.1]);
          place(c, 5.02, bw - 0.66, 0.14, T + 0.05, [rng() * 9, 0, 0, 0]);
          place(c, 0.78, bw - 0.66, 0.14, T + 0.05, [rng() * 9, 0, 0, 0]);
        }
        const pj = a0 + i * bw;
        const pjNearWin = isWinWall && WINDOWS.some(w => Math.abs(pj - w.z) < 1.35);
        if (i > 0 && !pjNearWin) {
          const off = T + 0.12;
          const pm = (g, y, dat, mg = marble) => mg.add(g, axis === 'z'
            ? mat(pj, y, at + sign * off) : mat(at + sign * off, y, pj), dat);
          pm(cyl(0.21, 0.24, ent0 - 0.52, 14), 0.52 + (ent0 - 0.52) / 2, [rng() * 9, 0, 0, 0]);
          pm(cyl(0.30, 0.22, 0.40, 14), ent0 - 0.24, [0, 0, 0, 0], plaster);   // carved cream capital
          const mb = axis === 'z'
            ? mat(pj, 0.40, at + sign * off, 0, 0, 0, 0.56, 0.26, 0.56)
            : mat(at + sign * off, 0.40, pj, 0, 0, 0, 0.56, 0.26, 0.56);
          marble.add(box(1, 1, 1), mb, [rng() * 9, 2, 0, 0]);
        }
      }
      // entablature: marble architrave, plaster frieze + cornice-ette
      place(mid, ent0 + 0.16, len, 0.34, T + 0.16, [rng() * 9, 0, 0, 0]);
      place(mid, ent0 + 0.50, len, 0.34, T + 0.10, [0, 0, 0, 0], plaster);
      place(mid, ent1 - 0.07, len, 0.18, T + 0.24, [0, 0, 0, 0], plaster);
      // attic: plaster field with herm posts continuing the bay rhythm
      place(mid, (ent1 + att1) / 2, len, att1 - ent1, T - 0.06, [0, 0, 0, 0], plaster);
      for (let i = 1; i < n; i++) {
        const pj = a0 + i * bw;
        const mh = axis === 'z'
          ? mat(pj, (ent1 + att1) / 2, at + sign * (T + 0.06), 0, 0, 0, 0.34, att1 - ent1, 0.22)
          : mat(at + sign * (T + 0.06), (ent1 + att1) / 2, pj, 0, 0, 0, 0.22, att1 - ent1, 0.34);
        plaster.add(box(1, 1, 1), mh, [0, 0, 0, 0]);
        const mk = axis === 'z'
          ? mat(pj, att1 - 0.12, at + sign * (T + 0.10))
          : mat(at + sign * (T + 0.10), att1 - 0.12, pj);
        plaster.add(sph(0.10, 10, 8), mk, [0, 0, 0, 0]);    // herm head knob (faceless)
      }
      // main cornice: stacked, bracketed, gilt bead
      moulding(plaster, axis === 'z' ? mid : at + sign * 0.30, att1, axis === 'z' ? at + sign * 0.30 : mid,
        len, axis === 'z' ? 'x' : 'z',
        [[0.02, 0.14, 0.42], [0.14, 0.12, 0.58], [0.26, 0.12, 0.74]], [0, 0, 0, 0]);
      const nb = Math.floor(len / 0.52);
      for (let i = 0; i < nb; i++) {
        const c = a0 + (i + 0.5) * (len / nb);

        plaster.add(box(1, 1, 1), m, [0, 0, 0, 0]);
      }
      const m2 = axis === 'z' ? mat(mid, att1 + 0.22, at + sign * 0.52, 0, 0, 0, len, 0.045, 0.045)
                              : mat(at + sign * 0.52, att1 + 0.22, mid, 0, 0, 0, 0.045, 0.045, len);
      brass.add(box(1, 1, 1), m2, [rng() * 9, 0, 0, 0]);
    }

    // ── window openings: deep reveals, arch shoulders, glass + mullions ─────
    for (const wnd of WINDOWS) {
      const topY = wnd.spring + wnd.r, gw = wnd.w, gh = topY - wnd.sill;

      marble.add(box(rev, 0.14, gw + 0.36), mat(x0 + rev/2 + 0.12, wnd.sill - 0.07, wnd.z), [rng()*9, 0, 0, 0]);
      marble.add(box(rev, gh + 0.30, 0.15), mat(x0 + rev/2 + 0.12, wnd.sill + gh/2, wnd.z - gw/2 - 0.075), [rng()*9, 0, 0, 0]);
      marble.add(box(rev, gh + 0.30, 0.15), mat(x0 + rev/2 + 0.12, wnd.sill + gh/2, wnd.z + gw/2 + 0.075), [rng()*9, 0, 0, 0]);
      marble.add(box(rev, 0.15, gw + 0.36), mat(x0 + rev/2 + 0.12, topY + 0.075, wnd.z), [rng()*9, 0, 0, 0]);

      marble.add(box(0.30, wnd.r * 0.9, 0.26), mat(x0 + 0.27, wnd.spring + wnd.r * 0.62, wnd.z + gw/2 - 0.10), [rng()*9, 0, 0, 0]);
      marble.add(new THREE.TorusGeometry(gw/2, 0.07, 8, 22, Math.PI), mat(x0 + 0.38, wnd.spring, wnd.z, 0, Math.PI/2, 0), [rng()*9, 0, 0, 0]);
      const gplane = new THREE.PlaneGeometry(gw, gh, 1, 1);
      glass.add(gplane, mat(x0 + 0.10, wnd.sill + gh/2, wnd.z, 0, Math.PI/2, 0), [rng()*9, 0, 0, 0]);
      for (let i = 0; i <= 2; i++)
        brass.add(box(0.05, gh, 0.04), mat(x0 + 0.14, wnd.sill + gh/2, wnd.z - gw/2 + (gw/2)*i), [rng()*9, 0, 0, 0]);
      brass.add(box(0.05, 0.05, gw), mat(x0 + 0.14, wnd.sill + gh*0.70, wnd.z), [rng()*9, 0, 0, 0]);
      brass.add(box(0.05, 0.04, gw), mat(x0 + 0.14, wnd.sill + gh*0.35, wnd.z), [rng()*9, 0, 0, 0]);
    }

    // ── cove vault rising to the flat laylight field, with transverse ribs ──
    {
      const inset = 0.35;
      const gx0 = x0 + inset, gx1 = x1 - inset, gz0 = z0 + inset, gz1 = z1 - inset;
      const geo = new THREE.PlaneGeometry(gx1 - gx0, gz1 - gz0, 72, 112);
      geo.rotateX(Math.PI / 2);
      const pa = geo.attributes.position;
      const coveY = (x, z) => {
        const t = Math.max(0, Math.min(1, Math.min(x - gx0, gx1 - x, z - gz0, gz1 - z) / coveW));
        return cor1 + (flatY - cor1) * Math.sin(t * Math.PI / 2);
      };
      for (let i = 0; i < pa.count; i++) pa.setY(i, coveY(pa.getX(i), pa.getZ(i)));
      geo.computeVertexNormals();
      plaster.add(geo, mat(0, 0, 0), [0, 0, 0, 0]);
      // transverse ornamented ribs at the bay joints
      for (const zR of [-7.8, -2.6, 2.6, 7.8]) {
        const steps = 30;
        for (let s = 0; s < steps; s++) {
          const x = gx0 + (s + 0.5) * (gx1 - gx0) / steps;
          plaster.add(box((gx1 - gx0) / steps + 0.06, 0.15, 0.55),
            mat(x, coveY(x, zR) - 0.075, zR), [0, 0, 0, 0]);
        }
        // sculpted plaster clusters at the rib springings (cupid-scale masses)
        for (const sx of [gx0 + 0.55, gx1 - 0.55]) {
          plaster.add(sph(0.24, 10, 8), mat(sx, cor1 + 0.30, zR, 0, 0, 0, 1, 0.78, 1), [0, 0, 0, 0]);
          plaster.add(sph(0.15, 8, 7), mat(sx + (sx < 0 ? 0.30 : -0.30), cor1 + 0.16, zR + 0.20), [0, 0, 0, 0]);
          plaster.add(sph(0.15, 8, 7), mat(sx + (sx < 0 ? 0.30 : -0.30), cor1 + 0.16, zR - 0.20), [0, 0, 0, 0]);
        }
      }
      // bake occluders: top slab + crude cove wedges near the walls
      occlude(0, flatY + 0.55, 0, W + 2, 1.0, D + 2);
      occlude(x0 + 0.9, (cor1 + flatY) / 2 + 0.5, 0, 1.8, flatY - cor1, D);
      occlude(x1 - 0.9, (cor1 + flatY) / 2 + 0.5, 0, 1.8, flatY - cor1, D);
      occlude(0, (cor1 + flatY) / 2 + 0.5, z0 + 0.9, W, flatY - cor1, 1.8);
      occlude(0, (cor1 + flatY) / 2 + 0.5, z1 - 0.9, W, flatY - cor1, 1.8);

    // ── the aedicule behind the bench: red breccia + diamond mosaic panel ───
    {
      const bz = z0 + 0.30;
      marble.add(box(5.2, 4.0, 0.10), mat(0, 2.95, bz + 0.05), [3, 1, 0, 0]);
      for (const s of [-1, 1]) {
        marble.add(box(0.42, 4.3, 0.16), mat(s * 2.75, 3.0, bz + 0.10), [4, 0, 0, 0]);
        marble.add(box(0.55, 3.6, 0.26), mat(s * 3.25, 2.85, bz + 0.15), [6, 1, 0, 0]);
        brass.add(box(0.62, 0.16, 0.30), mat(s * 3.25, 4.75, bz + 0.16), [rng() * 9, 0, 0, 0]);
        marble.add(box(0.66, 0.30, 0.32), mat(s * 3.25, 0.90, bz + 0.15), [7, 2, 0, 0]);
      }
      marble.add(box(5.9, 0.42, 0.16), mat(0, 5.10, bz + 0.10), [5, 0, 0, 0]);
      marble.add(box(7.3, 0.55, 0.34), mat(0, 5.44, bz + 0.16), [8, 1, 0, 0]);
      moulding(marble, 0, 5.66, bz + 0.20, 7.5, 'x', [[0.06, 0.10, 0.42]], [9, 0, 0, 0]);
      occlude(0, 3.1, bz + 0.12, 7.4, 5.4, 0.5);
      // the diamond-lozenge mosaic (geometric — deliberately non-identifying)
      mosaic.add(box(3.9, 2.6, 0.06), mat(0, 3.22, bz + 0.14), [0, 2, 64, 44]);
      brass.add(box(4.02, 0.05, 0.07), mat(0, 4.55, bz + 0.14), [1, 0, 0, 0]);
      brass.add(box(4.02, 0.05, 0.07), mat(0, 1.89, bz + 0.14), [1, 0, 0, 0]);
      brass.add(box(0.05, 2.71, 0.07), mat(-1.99, 3.22, bz + 0.14), [1, 0, 0, 0]);
      brass.add(box(0.05, 2.71, 0.07), mat(1.99, 3.22, bz + 0.14), [1, 0, 0, 0]);
    }

    // ── attic centrepiece: allegorical mosaic lunette (generic art — this
    //    replaces any seal or name; the room identifies no real court) ──────
    {
      const bz = z0 + 0.26;
      const lun = new THREE.CircleGeometry(0.88, 44, 0, Math.PI);
      mosaic.add(lun, mat(0, ent1 + 0.04, bz + 0.08), [0, 0, 90, 90]);
      plaster.add(new THREE.TorusGeometry(0.88, 0.07, 8, 44, Math.PI), mat(0, ent1 + 0.04, bz + 0.10), [0, 0, 0, 0]);
      brass.add(new THREE.TorusGeometry(0.81, 0.026, 6, 44, Math.PI), mat(0, ent1 + 0.04, bz + 0.12), [2, 0, 0, 0]);
    }

    // ── panelled mahogany doors (right wall + rear), marble entablatures ────
    for (const [dz, dw] of [[-8.3, 1.5], [6.2, 1.5]]) {
      wood.add(box(0.10, 3.0, dw), mat(x1 - 0.30, 1.5, dz), [70, 0, 0, 0]);
      wood.add(box(0.06, 2.55, dw - 0.34), mat(x1 - 0.34, 1.42, dz), [71, 0, 0, 0]);
      marble.add(box(0.20, 0.32, dw + 0.5), mat(x1 - 0.32, 3.22, dz), [rng() * 9, 0, 0, 0]);
      brass.add(sph(0.035, 8, 6), mat(x1 - 0.40, 1.05, dz - dw / 2 + 0.18), [rng() * 9, 0, 0, 0]);
    }
    wood.add(box(2.0, 3.4, 0.12), mat(0, 1.7, z1 - 0.30), [72, 0, 0, 0]);

    // ── laylights: glowing panels in hanging ornamented frames, ringed by
    //    marquee bulb strings (the hero photo's light source) ────────────────
    this.fixtures = [];            // warm-bulb bake sample points
    this._laylightSamples = [];    // cool-daylight bake sample points
    for (const L of LAYLIGHTS) {
      const fw = L.w, fd = L.d;
      for (const [cx, cz, sx, sz] of [
        [0, L.z - fd/2 - 0.12, fw + 0.72, 0.28], [0, L.z + fd/2 + 0.12, fw + 0.72, 0.28],

      // moulded lip + gilt beads on the frame
      for (const szn of [-1, 1]) {

      // marquee bulbs around the frame

      for (let i = 1; i < nz2; i++) for (const sxn of [-1, 1])

      // bake samples: one shared shadow ray per laylight, four corner emitters
      this.fixtures.push({
        c: [0, flatY - 0.45, L.z],
        pts: [[-fw/2, flatY - 0.45, L.z - fd/2, 0.9], [fw/2, flatY - 0.45, L.z - fd/2, 0.9],
              [-fw/2, flatY - 0.45, L.z + fd/2, 0.9], [fw/2, flatY - 0.45, L.z + fd/2, 0.9]],
      });
      this._laylightSamples.push([0, flatY - 0.12, L.z], [-fw/2 + 0.7, flatY - 0.12, L.z], [fw/2 - 0.7, flatY - 0.12, L.z]);
    }

    // finalize static meshes
    const meshes = [
      [marble, MATS.marble], [wood, MATS.wood], [plaster, MATS.plaster],
      [brass, MATS.brass], [mosaic, MATS.mosaic], [glass, MATS.glass],
      [lampGlass, MATS.lamp],
    ];
    for (const [mg, m] of meshes) {
      const mesh = new THREE.Mesh(mg.build(), m);
      mesh.frustumCulled = false;
      this.staticEnv.add(mesh);
    }
  }

  _buildFurniture(MATS) {
    const rng = mulberry32(977);

      this._chair(wood, leather, rng, tx, tz + 1.14, Math.PI);

    // ── the lectern (the camera stands just behind it) ──────────────────────
    {
